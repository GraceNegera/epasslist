services:
  public-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: passport_public
    ports: ["5433:5432"]
    volumes: [public-db:/var/lib/postgresql/data]
  staff-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: passport_staff
    ports: ["5434:5432"]
    volumes: [staff-db:/var/lib/postgresql/data]
volumes:
  public-db:
  staff-db:
